backend:
  name: github
  repo: nico-dela/aracelibonfigli
  branch: proposal-v2-cms
  base_url: https://api.netlify.com
  auth_endpoint: auth

# Para editar en local sin GitHub OAuth:
# 1) npm run cms
# 2) abrir http://localhost:4321/admin/
local_backend: true

media_folder: public/media/uploads
public_folder: /media/uploads

locale: es

collections:
  - name: settings
    label: Sitio
    files:
      - name: site
        label: Ajustes generales
        file: src/content/settings/site.md
        fields:
          - { label: Título, name: title, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: Descripción hero, name: description, widget: text }
          - { label: Imagen hero, name: heroImage, widget: string }
          - { label: Meta description, name: metaDescription, widget: text }
          - { label: Linktree, name: linktree, widget: string }
          - label: Destacados
            name: featured
            widget: list
            fields:
              - { label: Título, name: title, widget: string }
              - { label: Subtítulo, name: subtitle, widget: string }
              - { label: Descripción, name: description, widget: text }
              - { label: Imagen, name: image, widget: string }
              - { label: Enlace, name: href, widget: string }
          - { label: Cuerpo, name: body, widget: markdown, required: false }

  - name: pages
    label: Páginas
    files:
      - name: bio
        label: Biografía
        file: src/content/pages/bio.md
        fields:
          - { label: Título, name: title, widget: string }
          - label: Imágenes
            name: images
            widget: list
            fields:
              - { label: Imagen, name: src, widget: string }
              - { label: Alt, name: alt, widget: string, required: false }
          - { label: Texto, name: body, widget: markdown }

  - name: albums
    label: Álbumes
    folder: src/content/albums
    create: true
    slug: "{{slug}}"
    extension: md
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Año, name: year, widget: number }
      - { label: Tipo, name: type, widget: string, hint: "Álbum, EP, Full Album En Vivo…" }
      - { label: Portada (ruta o URL), name: cover, widget: string }
      - { label: Orden, name: order, widget: number }
      - { label: Resumen, name: summary, widget: text }
      - label: Tracks
        name: tracks
        widget: list
        fields:
          - { label: Título, name: title, widget: string }
          - { label: Audio (ruta o URL), name: src, widget: string }
      - { label: Descripción, name: body, widget: markdown }

  - name: books
    label: Libros
    folder: src/content/books
    create: true
    slug: "{{slug}}"
    extension: md
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Año, name: year, widget: number }
      - { label: Portada, name: cover, widget: string }
      - { label: Contratapa, name: backCover, widget: string, required: false }
      - { label: PDF, name: pdf, widget: string }
      - { label: Orden, name: order, widget: number }
      - { label: Resumen, name: summary, widget: text }
      - { label: Texto, name: body, widget: markdown }

  - name: videos
    label: Videos
    folder: src/content/videos
    create: true
    slug: "{{slug}}"
    extension: md
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Subtítulo, name: subtitle, widget: string, required: false }
      - { label: YouTube ID, name: youtubeId, widget: string }
      - { label: Orden, name: order, widget: number }
      - { label: Notas, name: body, widget: markdown, required: false }

  - name: productions
    label: Estudio
    folder: src/content/productions
    create: true
    slug: "{{slug}}"
    extension: md
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Meta, name: meta, widget: string, required: false }
      - { label: Rol, name: role, widget: string, required: false }
      - label: Categoría
        name: category
        widget: select
        options:
          - { label: Producción, value: produccion }
          - { label: Sesionista, value: sesionista }
      - { label: Orden, name: order, widget: number }
      - label: Spotify tipo
        name: spotifyType
        widget: select
        required: false
        options: [album, track]
      - { label: Spotify ID, name: spotifyId, widget: string, required: false }
      - { label: YouTube ID, name: youtubeId, widget: string, required: false }
      - { label: Notas, name: body, widget: markdown, required: false }

  - name: gallery
    label: Galería
    folder: src/content/gallery
    create: true
    slug: "{{slug}}"
    extension: md
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Año, name: year, widget: number }
      - { label: Orden, name: order, widget: number }
      - label: Imágenes
        name: images
        widget: list
        fields:
          - { label: URL o ruta, name: src, widget: string }
          - { label: Alt, name: alt, widget: string, required: false }
      - { label: Notas, name: body, widget: markdown, required: false }
